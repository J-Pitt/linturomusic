<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>linturo business card — print export</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    /* US standard + 0.125" bleed per side → 3.75" × 2.25" */
    @page {
      size: 3.75in 2.25in;
      margin: 0;
    }

    :root {
      --bleed: 0.125in;
      --trim-w: 3.5in;
      --trim-h: 2in;
      --page-w: 3.75in;
      --page-h: 2.25in;
      --purple-400: #c084fc;
      --pink-400: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: var(--page-w);
      height: var(--page-h);
      position: relative;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }

    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* Safe zone = trim area; bleed fills full page */
    .safe {
      position: absolute;
      inset: var(--bleed);
      display: flex;
      flex-direction: column;
    }

    /* —— Front —— */
    .front {
      background: linear-gradient(135deg, #581c87 0%, #0a0a0f 45%, #1e1b4b 100%);
    }

    .front .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      pointer-events: none;
    }

    .front .blob-1 {
      width: 1.7in; height: 1.7in;
      top: -0.45in; right: -0.35in;
      background: #a855f7; opacity: 0.45;
    }

    .front .blob-2 {
      width: 1.3in; height: 1.3in;
      bottom: -0.4in; left: -0.3in;
      background: #3b82f6; opacity: 0.35;
    }

    .front .blob-3 {
      width: 1in; height: 1in;
      top: 0.55in; left: 0.35in;
      background: #ec4899; opacity: 0.3;
    }

    .front .safe {
      justify-content: space-between;
      z-index: 1;
    }

    .front .safe > div:first-child {
      padding-top: 0.14in;
    }

    .brand {
      font-size: 0.72in;
      line-height: 0.9;
    }

    .waves {
      display: flex;
      align-items: flex-end;
      gap: 0.04in;
      height: 0.35in;
    }

    .wave-bar {
      width: 0.06in;
      border-radius: 999px;
      background: linear-gradient(to top, var(--purple-400), var(--pink-400));
      opacity: 0.85;
    }

    .wave-bar:nth-child(1) { height: 0.14in; }
    .wave-bar:nth-child(2) { height: 0.28in; }
    .wave-bar:nth-child(3) { height: 0.35in; }
    .wave-bar:nth-child(4) { height: 0.22in; }
    .wave-bar:nth-child(5) { height: 0.32in; }
    .wave-bar:nth-child(6) { height: 0.18in; }
    .wave-bar:nth-child(7) { height: 0.3in; }
    .wave-bar:nth-child(8) { height: 0.12in; }

    .genres {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.075in;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(216, 180, 254, 0.75);
      margin-top: 0.12in;
    }

    /* —— Back —— */
    .back {
      background: linear-gradient(145deg, #0f0f14 0%, #1e1033 50%, #0f172a 100%);
    }

    .back .safe {
      justify-content: center;
      gap: 0.14in;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .name-line {
      font-size: 0.28in;
      line-height: 1;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.1in;
      font-size: 0.085in;
      color: #e9d5ff;
    }

    .contact-row svg {
      width: 0.14in;
      height: 0.14in;
      flex-shrink: 0;
      color: var(--pink-400);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.5), transparent);
      margin: 0.04in 0;
    }

    .social {
      font-size: 0.072in;
      color: rgba(216, 180, 254, 0.8);
    }
  </style>
</head>
<body>
  <!-- Page 1: Front -->
  <section class="page front" aria-label="Front">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="safe">
      <div>
        <p class="brand font-brand">linturo</p>
      </div>
      <div>
        <div class="waves" aria-hidden="true">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        <p class="genres">House · Tech · Bass</p>
      </div>
    </div>
  </section>

  <!-- Page 2: Back -->
  <section class="page back" aria-label="Back">
    <div class="safe">
      <p class="name-line font-brand">linturo</p>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
        </svg>
        <span>linturomusic@gmail.com</span>
      </div>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />
        </svg>
        <span>linturomusic.com</span>
      </div>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
        </svg>
        <span>Brooklyn, New York</span>
      </div>
      <div class="divider"></div>
      <p class="social">@_linturo_ · soundcloud.com/linturo · youtube.com/@linturo</p>
    </div>
  </section>
</body>
</html>
